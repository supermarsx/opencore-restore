name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ShellCheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: "."
          severity: warning

  format:
    name: Format (shfmt)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install shfmt
        run: sudo snap install shfmt

      - name: Check Formatting
        run: shfmt -d -i 4 -ci .

  shell-tests:
    name: Shell Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run mocked disk test suites
        run: |
          chmod +x create_usb.sh create_usb_linux.sh restore.sh tests/*.sh
          cd tests
          ./test_restore.sh
          ./test_create_usb_macos.sh
          ./test_create_usb_linux.sh

  powershell-tests:
    name: PowerShell Tests
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Parse and test with Windows PowerShell 5.1
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path .\create_usb.ps1), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { $errors | Format-List; exit 1 }
          .\tests\test_create_usb.ps1

      - name: Parse and test with PowerShell
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path .\create_usb.ps1), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { $errors | Format-List; exit 1 }
          .\tests\test_create_usb.ps1

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $findings = @(Invoke-ScriptAnalyzer .\create_usb.ps1 -Severity Warning,Error)
          if ($findings.Count) { $findings | Format-List; exit 1 }
